<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Launcher</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <nav id="sidebar" aria-label="Nawigacja">
    <div class="brand"><img src="icon.svg" alt=""><span>Game Launcher</span></div>
    <button class="nav" data-page="home"><span class="ico">⌂</span>Start</button>
    <button class="nav" data-page="library"><span class="ico">▦</span>Biblioteka</button>
    <button class="nav" data-page="stats"><span class="ico">▤</span>Statystyki</button>
    <button class="nav" data-page="roadmap"><span class="ico">⚑</span>Roadmapa</button>
    <button class="nav" data-page="achievements"><span class="ico">★</span>Osiągnięcia</button>
    <button class="nav" data-page="news"><span class="ico">☰</span>Newsy</button>
    <button class="nav" data-page="music"><span class="ico">♫</span>Muzyka</button>
    <button class="nav" data-page="chat"><span class="ico">✉</span>Czat</button>
    <button class="nav" data-page="mods"><span class="ico">⚒</span>Mody</button>
    <button class="nav" data-page="settings"><span class="ico">⚙</span>Ustawienia</button>
    <div class="spacer"></div>
    <div id="nowplaying" class="hidden"></div>
    <div id="running" class="muted small"></div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<audio id="audio" preload="none"></audio>
<script src="app.js"></script>
</body>
</html>
