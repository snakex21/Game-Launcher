name: CI

on:
  push:
    branches: [main, "polish/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile all sources
        run: python -m compileall -q .

      - name: Import smoke test
        run: python -c "import game_launcher, chat_server; print('import OK')"
        env:
          GL_CHAT_SECRET_KEY: ci-only-not-a-secret

      - name: Run tests
        run: python -m pytest -v

      - name: Check that no user data or secrets are tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(local_settings|config)\.json$|\.db$|\.mp3$|__pycache__|games_saves/'; then
            echo "Tracked user data found"; exit 1
          fi
