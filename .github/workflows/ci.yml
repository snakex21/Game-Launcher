name: CI

on:
  push:
    branches: [main, "polish/**"]
  pull_request:

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that no user data or secrets are tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(local_settings|config)\.json$|\.db$|\.mp3$|__pycache__|games_saves/'; then
            echo "Tracked user data found"; exit 1
          fi
